name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Scheduled content is re-checked in the browser, so this nightly rebuild only refreshes the
    # build-time defaults (what no-JS visitors and crawlers see). Nothing breaks if GitHub pauses it.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ask GitHub Pages where the site is served. Before the custom domain is connected that's
      # https://winterfreshx.github.io with base_path /AdamsPTAWebsite; afterwards it's the custom domain with
      # an empty base_path. The build, verify and audit all follow automatically (see astro.config.mjs).
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - run: npm run verify
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - run: npm run audit:contrast # rendered-color WCAG check; ubuntu-latest ships Google Chrome
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      # Menu tests in WebKit (Safari's engine, for iPhone) and Chromium.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:menu
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
